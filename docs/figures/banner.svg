<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    
    <radialGradient id="cyanGlow" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="heatGlow" cx="85%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.24"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#2DD4BF"/>
      <stop offset="70%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Thermal Wave Gradient -->
    <linearGradient id="thermalWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#F59E0B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="40" cy="0" r="1.5" fill="#38BDF8" fill-opacity="0.3"/>
    </pattern>

    <!-- Building Shadows -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#gridPattern)"/>
  <circle cx="180" cy="110" r="280" fill="url(#cyanGlow)"/>
  <circle cx="1020" cy="240" r="320" fill="url(#heatGlow)"/>

  <!-- Geometric Isometric 3D City Skyline (Right Side Visual) -->
  <g transform="translate(820, 70)" filter="url(#shadowFilter)">
    <!-- Building 1 (Tall Modern Tower) -->
    <g transform="translate(60, 20)">
      <!-- Left Face (Shadowed) -->
      <polygon points="40,20 0,45 0,180 40,155" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
      <!-- Right Face (Thermal Heat Signature) -->
      <polygon points="40,20 80,45 80,180 40,155" fill="#0F172A" stroke="#334155" stroke-width="0.5"/>
      <!-- Top Face (Cool Roof / Green Roof) -->
      <polygon points="40,20 80,45 40,70 0,45" fill="#10B981" fill-opacity="0.85" stroke="#34D399" stroke-width="1"/>
      <!-- Windows / Sensors -->
      <line x1="15" y1="75" x2="15" y2="165" stroke="#38BDF8" stroke-dasharray="4,6" stroke-width="1.5" stroke-opacity="0.7"/>
      <line x1="65" y1="75" x2="65" y2="165" stroke="#F59E0B" stroke-dasharray="4,6" stroke-width="1.5" stroke-opacity="0.7"/>
    </g>

    <!-- Building 2 (Mid-rise Left) -->
    <g transform="translate(-10, 80)">
      <polygon points="35,15 0,35 0,140 35,120" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
      <polygon points="35,15 70,35 70,140 35,120" fill="#0F172A" stroke="#334155" stroke-width="0.5"/>
      <polygon points="35,15 70,35 35,55 0,35" fill="#06B6D4" fill-opacity="0.85" stroke="#38BDF8" stroke-width="1"/>
      <line x1="18" y1="60" x2="18" y2="125" stroke="#2DD4BF" stroke-dasharray="3,5" stroke-width="1.2"/>
    </g>

    <!-- Building 3 (High-Thermal Block Right) -->
    <g transform="translate(140, 60)">
      <polygon points="35,15 0,35 0,160 35,140" fill="#332A2B" stroke="#4A3434" stroke-width="0.5"/>
      <polygon points="35,15 70,35 70,160 35,140" fill="#1F1618" stroke="#4A3434" stroke-width="0.5"/>
      <!-- Hot Roof (UHI Hotspot) -->
      <polygon points="35,15 70,35 35,55 0,35" fill="#EF4444" fill-opacity="0.85" stroke="#F87171" stroke-width="1"/>
      <line x1="52" y1="60" x2="52" y2="145" stroke="#F97316" stroke-dasharray="3,5" stroke-width="1.2"/>
    </g>

    <!-- Tree Canopy Vector Indicators -->
    <g transform="translate(45, 185)">
      <circle cx="15" cy="15" r="14" fill="#059669" fill-opacity="0.8" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="15" cy="15" r="8" fill="#10B981" fill-opacity="0.9"/>
    </g>
    <g transform="translate(125, 175)">
      <circle cx="12" cy="12" r="12" fill="#059669" fill-opacity="0.8" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="6" fill="#10B981" fill-opacity="0.9"/>
    </g>

    <!-- 10m Microgrid Contour Waves -->
    <path d="M -40 220 Q 50 170, 140 200 T 260 190" fill="none" stroke="url(#thermalWave)" stroke-width="3" filter="url(#neonGlow)"/>
    <path d="M -20 235 Q 70 190, 160 215 T 280 205" fill="none" stroke="url(#thermalWave)" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>

  <!-- Left Content Branding -->
  <g transform="translate(70, 50)">
    <!-- Platform Tag Badge -->
    <g transform="translate(0, 10)">
      <rect width="365" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <circle cx="14" cy="14" r="5" fill="#10B981" filter="url(#neonGlow)"/>
      <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#38BDF8" letter-spacing="1.2">CLIMATE RESILIENCE DIGITAL TWIN PLATFORM</text>
    </g>

    <!-- Master Title -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5" filter="url(#neonGlow)">
      UrbanCoolSim
    </text>
    <text x="350" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#F43F5E" letter-spacing="1.5">v3.0 C3 PROD</text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="url(#subGrad)">
      Physics Surface Energy Balance • LightGBM AI Surrogate • NSGA-II Multi-Objective Decision Support
    </text>

    <!-- Core Scientific Pillars / Feature Chips -->
    <g transform="translate(0, 165)">
      <!-- Chip 1: 10m Microgrid -->
      <g transform="translate(0, 0)">
        <rect width="138" height="30" rx="6" fill="#1E293B" stroke="#06B6D4" stroke-width="1"/>
        <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">🌐 10m Microgrid</text>
      </g>

      <!-- Chip 2: SEB Physics -->
      <g transform="translate(148, 0)">
        <rect width="154" height="30" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
        <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">☀️ 1D SEB Solver</text>
      </g>

      <!-- Chip 3: AI Surrogate -->
      <g transform="translate(312, 0)">
        <rect width="170" height="30" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
        <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">⚡ LightGBM &amp; SHAP</text>
      </g>

      <!-- Chip 4: NSGA-II Optimizer -->
      <g transform="translate(492, 0)">
        <rect width="160" height="30" rx="6" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
        <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">🧬 NSGA-II Genetic</text>
      </g>
    </g>

    <!-- Cloud & Deployment Architecture Row -->
    <g transform="translate(0, 215)">
      <g transform="translate(0, 0)">
        <rect width="190" height="26" rx="4" fill="#0C4A6E" fill-opacity="0.4" stroke="#0284C7" stroke-width="0.8"/>
        <text x="10" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7DD3FC">🚀 Live API: Render PaaS</text>
      </g>
      <g transform="translate(200, 0)">
        <rect width="190" height="26" rx="4" fill="#064E3B" fill-opacity="0.4" stroke="#059669" stroke-width="0.8"/>
        <text x="10" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#6EE7B7">⚡ Frontend: Next.js 14</text>
      </g>
      <g transform="translate(400, 0)">
        <rect width="190" height="26" rx="4" fill="#3B0764" fill-opacity="0.4" stroke="#7E22CE" stroke-width="0.8"/>
        <text x="10" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#D8B4FE">🛡️ Quality Gate: 113 Tests</text>
      </g>
    </g>

    <!-- Mission Quote Banner -->
    <g transform="translate(0, 260)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style="italic" fill="#64748B">
        "We are not selling a heat map. We are selling better urban infrastructure decisions."
      </text>
    </g>
  </g>

  <!-- Modern Border Framing -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="0" fill="none" stroke="#1E293B" stroke-width="1"/>
  <line x1="0" y1="358" x2="1200" y2="358" stroke="url(#thermalWave)" stroke-width="2"/>
</svg>